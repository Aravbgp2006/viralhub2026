<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Latest Viral Videos 2026 CMS</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23000000%22/><polygon points=%2240,30 75,50 40,70%22 fill=%22%23ffffff%22/></svg>">
</head>
<body class="admin-body">

  <div class="login-page-container">
    <div class="login-card">
      <div class="login-icon-box">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1 class="login-title">Admin Login</h1>
      <p class="login-subtitle">Enter your credentials to access the ViralHub CMS</p>

      <div id="loginErrorBanner" class="form-error-banner" style="margin-bottom: 16px;"></div>

      <form id="adminLoginForm" class="login-form">
        <div class="form-group">
          <label class="form-label" for="adminUsername">Username</label>
          <input type="text" id="adminUsername" class="form-input" placeholder="admin" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="adminPassword">Password</label>
          <input type="password" id="adminPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn-primary-dark" style="width: 100%; justify-content: center; height: 48px; margin-top: 8px;">
          Log In to Dashboard
        </button>
      </form>

      <div class="login-footer-link">
        <a href="/">← Return to Public Homepage</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('adminLoginForm');
    const errorBanner = document.getElementById('loginErrorBanner');
    const submitBtn = document.getElementById('btnLoginSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying credentials...';

      const username = document.getElementById('adminUsername').value.trim();
      const password = document.getElementById('adminPassword').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          submitBtn.textContent = 'Redirecting to Dashboard...';
          window.location.href = '/admin';
        } else {
          errorBanner.textContent = data.error || 'Invalid credentials. Please try again.';
          errorBanner.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In to Dashboard';
        }
      } catch (err) {
        console.error('Login request failed:', err);
        errorBanner.textContent = 'Connection error. Please ensure the server is running.';
        errorBanner.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In to Dashboard';
      }
    });
  </script>
</body>
</html>
